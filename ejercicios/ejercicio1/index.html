<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Ejercicio 1 - Manipulación del DOM</title>
</head>
<body>
  <h1 id="titulo">Título original</h1>
  <p class="descripcion">Este párrafo recibe un borde desde JavaScript.</p>
  <button id="cambiarTexto">Mostrar lista</button>
  <div id="contenido-dinamico"></div>

  <script>
    // getElementById: selecciona el título y cambia su texto
    const titulo = document.getElementById("titulo");
    titulo.textContent = "¡Página Interactiva!";

    // querySelector: selecciona el párrafo por su clase y le agrega un borde
    const descripcion = document.querySelector(".descripcion");
    descripcion.style.border = "1px solid black";

    // event listener: al hacer clic se rellena el div con una lista
    const boton = document.getElementById("cambiarTexto");
    const contenido = document.getElementById("contenido-dinamico");

    boton.addEventListener("click", () => {
      contenido.innerHTML = `
        <ul>
          <li>Primer elemento</li>
          <li>Segundo elemento</li>
          <li>Tercer elemento</li>
        </ul>
      `;
    });
  </script>
</body>
</html>
