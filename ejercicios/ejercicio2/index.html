<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Ejercicio 2 - Creación y Eliminación de Elementos</title>
</head>
<body>
  <h1>Lista de ítems</h1>

  <ul id="lista-items"></ul>

  <input type="text" id="nuevo-item-texto" placeholder="Nuevo ítem">
  <button id="agregar">Agregar</button>
  <button id="eliminar">Eliminar último</button>

  <script>
    const lista = document.getElementById("lista-items");
    const campo = document.getElementById("nuevo-item-texto");

    document.getElementById("agregar").addEventListener("click", () => {
      // lee el valor del campo de texto
      const texto = campo.value.trim();
      if (texto === "") return;

      // crea el <li> y lo añade al final de la lista
      const item = document.createElement("li");
      item.textContent = texto;
      lista.appendChild(item);

      // limpia el campo
      campo.value = "";
      campo.focus();
    });

    document.getElementById("eliminar").addEventListener("click", () => {
      // si la lista está vacía lastElementChild es null y no se hace nada
      const ultimo = lista.lastElementChild;
      if (ultimo) {
        ultimo.remove();
      }
    });
  </script>
</body>
</html>
