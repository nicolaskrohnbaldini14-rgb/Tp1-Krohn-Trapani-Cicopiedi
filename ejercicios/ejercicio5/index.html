<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Ejercicio 5 - CSS Grid</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <h1>Layout con grid-column / grid-row</h1>
  <div class="grid-container">
    <header class="grid-item header">Header</header>
    <nav class="grid-item sidebar">Sidebar</nav>
    <main class="grid-item content">Main Content</main>
    <footer class="grid-item footer">Footer</footer>
  </div>

  <h1>(Opcional) Mismo layout con grid-template-areas</h1>
  <div class="grid-container con-areas">
    <header class="grid-item header">Header</header>
    <nav class="grid-item sidebar">Sidebar</nav>
    <main class="grid-item content">Main Content</main>
    <footer class="grid-item footer">Footer</footer>
  </div>
</body>
</html>
