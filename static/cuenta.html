<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Mi cuenta · Suscripciones+</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body data-pagina="cuenta">
  <header class="barra">
    <a href="/" class="marca">Suscripciones+</a>
    <!-- app.js reemplaza estos links según la sesión -->
    <nav id="navegacion">
      <a href="login.html">Iniciar sesión</a>
      <a href="registro.html" class="boton">Registrarse</a>
    </nav>
  </header>

  <div id="mensaje" class="mensaje" role="status" hidden></div>

  <main class="contenido">
    <section class="bienvenida">
      <h1 id="saludo">Hola</h1>
      <p id="resumen" class="lema"></p>
    </section>

    <div class="opciones">
      <a href="suscripciones.html" class="opcion panel">
        <h3>Ver mis suscripciones</h3>
        <p>Consultá todo lo que pagás, el estado y la vigencia de cada servicio.</p>
      </a>
      <a href="nueva-suscripcion.html" class="opcion panel">
        <h3>Nueva suscripción</h3>
        <p>Agregá un servicio al que te suscribiste para tenerlo controlado.</p>
      </a>
    </div>

  <footer class="pie">
    <small>Krohn · Trapani · Cicopiedi</small>
  </footer>

  <script src="app.js"></script>
