<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Iniciar sesión · Suscripciones+</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body data-pagina="login">
  <header class="barra">
    <a href="/" class="marca">Suscripciones+</a>
    <!-- app.js reemplaza estos links según la sesión -->
    <nav id="navegacion">
      <a href="login.html">Iniciar sesión</a>
      <a href="registro.html" class="boton">Registrarse</a>
    </nav>
  </header>

  <div id="mensaje" class="mensaje" role="status" hidden></div>

  <main class="contenido">
    <section class="panel tarjeta-chica">
      <h2>Iniciar sesión</h2>
      <form id="form-login" class="formulario">
        <label>Email
          <input type="email" name="email" required autofocus>
        </label>
        <label>Contraseña
          <input type="password" name="password" required>
        </label>
        <button type="submit">Ingresar</button>
      </form>
      <p class="ayuda">¿No tenés cuenta? <a href="registro.html">Registrate</a></p>
    </section>
  </main>

  <footer class="pie">
    <p id="aviso-empresas">¿Sos una empresa? <a href="registro.html?tipo=empresa">Registrá tu empresa</a> para publicar tus servicios.</p>
    <small>Krohn · Trapani · Cicopiedi</small>
  </footer>

  <script src="app.js"></script>
</body>
</html>
