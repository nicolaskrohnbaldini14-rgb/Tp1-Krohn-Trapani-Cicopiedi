<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Nueva suscripción · Suscripciones+</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body data-pagina="nueva-suscripcion">
  <header class="barra">
    <a href="/" class="marca">Suscripciones+</a>
    <!-- app.js reemplaza estos links según la sesión -->
    <nav id="navegacion">
      <a href="login.html">Iniciar sesión</a>
      <a href="registro.html" class="boton">Registrarse</a>
    </nav>
  </header>

  <div id="mensaje" class="mensaje" role="status" hidden></div>

  <main class="contenido">
    <h1>Nueva suscripción</h1>

    <section class="panel">
      <form id="form-suscripcion" class="formulario formulario-grilla">
        <label>Servicio
          <select name="id_servicio" id="select-servicios" required></select>
        </label>
        <label>Monto mensual
          <input type="number" name="monto" min="0.01" step="0.01" required>
        </label>
        <label>Estado
          <select name="estado">
            <option>Activa</option>
            <option>Pausada</option>
            <option>Cancelada</option>
          </select>
        </label>
        <label>Fecha de inicio
          <input type="date" name="fecha_inicio" required>
        </label>
        <label>Fecha de vencimiento
          <input type="date" name="fecha_vencimiento" required>
        </label>
        <label>Usuario de la cuenta del servicio
          <input type="text" name="usuario_cuenta" required>
        </label>
        <label>Contraseña de la cuenta del servicio
          <input type="password" name="password_cuenta" required>
        </label>
        <button type="submit">Crear suscripción</button>
      </form>
    </section>

    <p><a href="suscripciones.html">← Volver a mis suscripciones</a></p>
  </main>

  <footer class="pie">
    <small>Krohn · Trapani · Cicopiedi</small>
  </footer>

  <script src="app.js"></script>
</body>
</html>
