<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <!-- si cambia, app.js recarga las copias viejas que tenga guardadas el navegador -->
  <meta name="version-pagina" content="2026-10-29b">
  <title>Nueva suscripción · Suscripciones+</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body data-pagina="nueva-suscripcion">
  <header class="barra">
    <a href="/" class="marca">Suscripciones+</a>
    <!-- app.js completa el menú de servicios y cambia los links según la sesión -->
    <nav id="navegacion">
      <div class="desplegable" id="desplegable-servicios">
        <button type="button" class="nav-item desplegable-boton" id="boton-servicios" aria-expanded="false" aria-controls="panel-servicios">Servicios ▾</button>
        <!-- panel a pantalla completa con el catálogo (lo completa app.js) -->
        <div class="panel-servicios" id="panel-servicios" hidden>
          <div class="panel-servicios-contenido">
            <div class="panel-servicios-encabezado">
              <div>
                <h2>Servicios disponibles</h2>
                <p id="panel-servicios-ayuda" class="panel-servicios-ayuda"></p>
              </div>
              <button type="button" id="cerrar-servicios" class="panel-servicios-cerrar" aria-label="Cerrar">×</button>
            </div>
            <div id="menu-servicios" class="panel-servicios-grilla"></div>
          </div>
        </div>
      </div>
      <a href="login.html" class="nav-item">Iniciar sesión</a>
      <a href="registro.html" class="boton">Registrarse</a>
    </nav>
  </header>

  <div id="mensaje" class="mensaje" role="status" hidden></div>

  <main class="contenido">
    <h1>Nueva suscripción</h1>

    <section class="panel">
      <form id="form-suscripcion" class="formulario formulario-grilla">
        <label>Servicio
          <select name="id_servicio" id="select-servicios" required></select>
        </label>
        <label>Monto mensual
          <input type="number" name="monto" min="0.01" step="0.01" required>
        </label>
        <label>Fecha de inicio
          <input type="date" name="fecha_inicio" required>
        </label>
        <label>Fecha de vencimiento
          <input type="date" name="fecha_vencimiento" required>
        </label>
        <label>Usuario de la cuenta del servicio (opcional)
          <input type="text" name="usuario_cuenta">
        </label>
        <label>Contraseña de la cuenta del servicio (opcional)
          <input type="password" name="password_cuenta">
        </label>
        <button type="submit">Crear suscripción</button>
      </form>
    </section>

    <p><a href="suscripciones.html">← Volver a mis suscripciones</a></p>
  </main>

  <footer class="pie">
    <small>Krohn · Trapani · Cicopiedi</small>
  </footer>

  <script src="app.js"></script>
</body>
</html>
