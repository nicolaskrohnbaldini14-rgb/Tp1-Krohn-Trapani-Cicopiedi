<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Mis suscripciones · Suscripciones+</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body data-pagina="suscripciones">
  <header class="barra">
    <a href="/" class="marca">Suscripciones+</a>
    <!-- app.js completa el menú de servicios y cambia los links según la sesión -->
    <nav id="navegacion">
      <div class="desplegable" id="desplegable-servicios">
        <button type="button" class="desplegable-boton" aria-haspopup="true">Servicios ▾</button>
        <ul class="desplegable-menu" id="menu-servicios"></ul>
      </div>
      <a href="login.html">Iniciar sesión</a>
      <a href="registro.html" class="boton">Registrarse</a>
    </nav>
  </header>

  <div id="mensaje" class="mensaje" role="status" hidden></div>

  <main class="contenido">
    <div class="titulo-con-accion">
      <div>
        <h1>Mis suscripciones</h1>
        <p id="titulo-mes" class="lema">Vencimientos del mes</p>
      </div>
      <a href="nueva-suscripcion.html" class="boton">Nueva suscripción</a>
    </div>

    <!-- lista de los vencimientos del mes y, al costado, el calendario -->
    <div class="vencimientos">
      <section class="panel">
        <p id="total-mensual" class="total"></p>
        <ul id="lista-suscripciones" class="lista"></ul>

        <!-- app.js completa los links con ?mes=AAAA-MM -->
        <nav class="navegacion-meses" aria-label="Otros meses">
          <a id="mes-anterior" href="suscripciones.html">← Mes anterior</a>
          <a id="mes-siguiente" href="suscripciones.html">Mes siguiente →</a>
        </nav>
      </section>

      <aside class="panel calendario" aria-labelledby="calendario-titulo">
        <h2 id="calendario-titulo">Calendario</h2>
        <div id="calendario" class="calendario-grilla"></div>
        <p class="calendario-ayuda">Pasá el cursor por un día marcado para ver qué vence.</p>
      </aside>
    </div>
  </main>

  <footer class="pie">
    <small>Krohn · Trapani · Cicopiedi</small>
  </footer>

  <script src="app.js"></script>
</body>
</html>
